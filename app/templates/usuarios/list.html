{% extends "base.html" %}
{% block title %}JobReady — Usuários{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <h1>Usuários</h1>
    <p>Cadastro e gerenciamento de usuários da plataforma.</p>
  </div>
  <button class="btn btn-primary" id="btn-novo">+ Novo</button>
</div>

<div class="alert" id="crud-alert" style="display:none;"></div>

<table id="crud-table">
  <thead>
    <tr>
      <th>ID</th>
      <th>Nome</th>
      <th>E-mail</th>
      <th>Criado em</th>
      <th></th>
    </tr>
  </thead>
  <tbody></tbody>
</table>
<div class="empty-state" id="empty-state" style="display:none;">Nenhum registro cadastrado ainda.</div>

<div class="modal-backdrop" id="crud-modal-backdrop">
  <div class="modal">
    <h2 id="crud-modal-title">Novo Usuário</h2>
    <form id="crud-form">
      <div class="field">
        <label>Nome</label>
        <input type="text" name="nome" required>
      </div>
      <div class="field">
        <label>E-mail</label>
        <input type="email" name="email" required>
      </div>
      <div class="field">
        <label>Senha</label>
        <input type="password" name="senha" required>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="btn-cancelar">Cancelar</button>
        <button type="submit" class="btn btn-primary">Salvar</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/crud.js') }}"></script>
<script>
initCrudPage({
  apiUrl: "/api/usuarios",
  singular: "Usuário",
  columns: [
    { key: "id", label: "ID" },
    { key: "nome", label: "Nome" },
    { key: "email", label: "E-mail" },
    { key: "criado_em", label: "Criado em" }
  ],
  fields: [
    { name: "nome", type: "text" },
    { name: "email", type: "email" },
    { name: "senha", type: "password" }
  ],
});
</script>
{% endblock %}
