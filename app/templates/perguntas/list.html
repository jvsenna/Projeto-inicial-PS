{% extends "base.html" %}
{% block title %}JobReady — Perguntas{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <h1>Perguntas</h1>
    <p>Banco de perguntas frequentes usadas nas simulações.</p>
  </div>
  <button class="btn btn-primary" id="btn-novo">+ Novo</button>
</div>

<div class="alert" id="crud-alert" style="display:none;"></div>

<table id="crud-table">
  <thead>
    <tr>
      <th>ID</th>
      <th>Pergunta</th>
      <th>Categoria</th>
      <th>Dificuldade</th>
      <th></th>
    </tr>
  </thead>
  <tbody></tbody>
</table>
<div class="empty-state" id="empty-state" style="display:none;">Nenhum registro cadastrado ainda.</div>

<div class="modal-backdrop" id="crud-modal-backdrop">
  <div class="modal">
    <h2 id="crud-modal-title">Novo Pergunta</h2>
    <form id="crud-form">
      <div class="field">
        <label>Texto da pergunta</label>
        <textarea name="texto" required></textarea>
      </div>
      <div class="field">
        <label>Categoria</label>
        <select name="categoria">
          <option value="comportamental">comportamental</option>
          <option value="tecnica">tecnica</option>
          <option value="situacional">situacional</option>
        </select>
      </div>
      <div class="field">
        <label>Dificuldade</label>
        <select name="dificuldade">
          <option value="facil">facil</option>
          <option value="media">media</option>
          <option value="dificil">dificil</option>
        </select>
      </div>
      <div class="field">
        <label>Sugestão de resposta</label>
        <textarea name="sugestao_resposta"></textarea>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="btn-cancelar">Cancelar</button>
        <button type="submit" class="btn btn-primary">Salvar</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/crud.js') }}"></script>
<script>
initCrudPage({
  apiUrl: "/api/perguntas",
  singular: "Pergunta",
  columns: [
    { key: "id", label: "ID" },
    { key: "texto", label: "Pergunta" },
    { key: "categoria", label: "Categoria" },
    { key: "dificuldade", label: "Dificuldade" }
  ],
  fields: [
    { name: "texto", type: "textarea" },
    { name: "categoria", type: "select" },
    { name: "dificuldade", type: "select" },
    { name: "sugestao_resposta", type: "textarea" }
  ],
});
</script>
{% endblock %}
